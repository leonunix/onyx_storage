# Cuckoo dedup-index ONLINE MODULUS RESIZE box test profile.
# Derived from nvme-chunklet.toml (Phase 3: LV3 RAID6 + LV2 RAID10 + metadb
# RAID10 meta LD all in ONE chunklet pool). The ONLY differences vs the
# production baseline are the intentionally SMALL initial cuckoo modulus +
# the [dedup] auto-resize knobs + a faster scanner interval so the online
# resize staircase (begin_grow -> migrate -> swap) fires and completes at an
# observable pace under a dedup-heavy fio load.
#
# Stable EUI paths for the 10x 7.68TB Dell Ent NVMe devices. Keep using
# by-id here: kernel nvmeXnY names reshuffle across reboots. None of these is
# sda=DELLBOSS; re-verify serial/content before any destructive chunklet-init.
#
# Run:
#   target/release/onyx-storage -c config/nvme-cuckoo-resize.toml chunklet-init --force
#   # copy the printed lv3/lv2/meta ld ids into [chunklet] below, then:
#   target/release/onyx-storage -c config/nvme-cuckoo-resize.toml create-volume -n fio-volume -s 274877906944 --compression lz4
#   RUST_LOG=info target/release/onyx-storage -c config/nvme-cuckoo-resize.toml start -v fio-volume

[numa]
mode = "confine"
home_node = 0
reserve_cores_per_node = 2
foreground_cores_per_node = 12
cold_cache_policy = "auto"

[chunklet]
enabled = true
# 10 raw NVMe PDs. Verify by serial/content before any destructive init.
devices = [
    "/dev/disk/by-id/nvme-eui.36434d30574023960025384300000002",
    "/dev/disk/by-id/nvme-eui.36434d30574020500025384300000002",
    "/dev/disk/by-id/nvme-eui.36434d30574023950025384300000002",
    "/dev/disk/by-id/nvme-eui.36434d30574020350025384300000002",
    "/dev/disk/by-id/nvme-eui.36434d30574023870025384300000002",
    "/dev/disk/by-id/nvme-eui.36434d30574023250025384300000002",
    "/dev/disk/by-id/nvme-eui.36434d30574020330025384300000002",
    "/dev/disk/by-id/nvme-eui.36434d30574023940025384300000002",
    "/dev/disk/by-id/nvme-eui.36434d30574023730025384300000002",
    "/dev/disk/by-id/nvme-eui.36434d30574020360025384300000002",
]
io_backend = "uring"
spare_pct = 5
watchdog_enabled = true
watchdog_interval_secs = 10
watchdog_fail_threshold = 3
auto_failover = true
# LV3 = RAID6 (8 data + 2 parity), 100 rows, 256 KiB strip. Every row uses all
# ten NVMe devices, avoiding the row-to-row tail variance seen when an 8-wide
# set rotated across a 10-PD pool. Full-stripe writes are 2 MiB.
lv3 = { raid = "raid6", set_size = 8, row_size = 1, num_rows = 100, strip_kib = 256 }
# LV2 = RAID10 (2-way mirror, 2-wide stripe), 6 rows -> ~12 GiB usable.
lv2 = { raid = "raid10", set_size = 2, row_size = 2, num_rows = 256, strip_kib = 128 }
# metadb LD (Phase 3f). RAID10 2x mirror, 32 rows -> ~64 GiB usable (>> the
# ~2 GiB the largest cuckoo table + L2P/rc need even after several grows).
meta = { raid = "raid10", set_size = 2, row_size = 2, num_rows = 32, strip_kib = 128 }
# Fresh no-migration 10-wide stack for the 2026-07-11 A/B. The prior 8-wide
# LV3 and its LV2/meta LDs remain allocated and untouched for rollback.
lv3_ld_id = "5af723d5-b4a9-41d5-a382-1775c8a201b2"
lv2_ld_id = "9b70b036-9eb3-4b3d-9206-d7b4f4818bcf"
meta_ld_id = "49464ea3-85ea-4e2a-aca2-b2537c801925"

[meta]
backend = "chunklet"
path = "/mnt/onyx-meta/metadb"
block_cache_mb = 32768
memtable_budget_mb = 8192
index_pin_mb = 8192
lsm_bloom_bits_per_entry = 20
checkpoint_interval_ms = 120000
# LV2 is the cheap durable aggregation window. Checkpoint before the physical
# ring reaches throttle territory, while allowing repeated LBA/PBA updates to
# collapse for up to two minutes under lighter pressure.
checkpoint_ring_fill_pct = 50
flush_dirty_pages_threshold = 0
group_commit_timeout_us = 1
dedup_shards = 8
# ── RESIZE TEST: intentionally SMALL initial modulus so the auto-grow fires
#    quickly. 65536 buckets x 4 slots = 262144 capacity; watermark 0.5 => first
#    grow at ~131072 live dedup entries. Staircase 64K->128K->256K->512K->1M...
dedup_cuckoo_buckets = 65536
dedup_l1_cache_entries = 256000
l2p_buffer_enabled = true
l2p_buffer_soft_entries = 16000000
l2p_buffer_hard_entries = 2000000
l2p_buffer_max_interval_ms = 120000
rc_authoritative_reclaim = true
commit_direct_apply_enabled = true
# Let the flusher issue several already-built metadata transactions before it
# waits for the oldest apply outcome. The LV2 log remains the durability point;
# this only overlaps metadb apply latency during background drain.
commit_deferred_outcomes_enabled = true
bfg_threads_enabled = true
parallel_l2p_drain_enabled = false
l2p_drain_chunk_entries = 4096
l2p_checkpoint_pipeline_enabled = true

[storage]
block_size = 4096
use_hugepages = false
default_compression = "Lz4"
io_backend = "uring"
uring_sq_entries = 1024
read_pool_workers = 32
raid_full_stripe_writes = true

[buffer]
capacity_mb = 524288
flush_watermark_pct = 80
group_commit_wait_us = 100
shards = 16
max_memory_mb = 16384
volatile_memory_mb = 49152
staging_queue_entries = 1048576
sync_batch_max_entries = 131072
sync_batch_max_bytes_mb = 1024
# Pace against physical LV2 occupancy (including checkpoint-retained entries)
# before reserve_log_space falls into hard condvar backpressure.
throttle_min_pct = 70
throttle_max_pct = 95
throttle_scale_us = 10
throttle_cap_us = 2000

[ublk]
nr_queues = 8
queue_depth = 256
io_buf_bytes = 1048576
queue_workers = 8

[flush]
compress_workers = 2
# Keep one compression unit at 512 KiB (one quarter of the 2 MiB RAID6
# stripe). The writer combines up to four units into full-stripe IO without
# forcing a foreground 4 KiB read to decompress an entire 2 MiB unit.
coalesce_max_raw_bytes = 524288
coalesce_max_lbas = 128
min_compression_savings_pct = 12
skip_fully_superseded = true
# Collapse overwrites in the 512 GiB LV2 before paying LV3 + metadata writes.
# Bypass on PHYSICAL ring occupancy so checkpoint-retained slots cannot hide
# pressure behind a low logical-pending value.
buffer_write_window_ms = 30000
buffer_write_window_pressure_pct = 50
packed_meta_batch_max_lbas = 1024
# Batch adjacent packed-slot metadata jobs into one metadb transaction. The
# unbatched path degenerates to ~1 LBA/commit under dedup-heavy random writes,
# leaving commit workers queued behind millisecond-scale apply service.
commit_workers_per_volume = 8
commit_target_lbas_per_tx = 8192
# Keep enough work behind each of the eight volume workers for the batched
# L2P/RC paths to amortise their lane footprint. The short wait applies only to
# a sparse worker queue; under sustained load try_recv fills the 16K budget.
commit_coalesce_lba_budget = 16384
commit_coalesce_timeout_us = 2000
packed_commit_try_drain_lba_budget = 150
writer_read_active_batch_size = 1024
commit_worker_deferred_outcomes = true
commit_worker_pipeline_depth = 4

[engine]
zone_count = 256
zone_size_blocks = 256
recovery_timeout_ms = 600000

[gc]
enabled = true
scan_interval_ms = 5000
dead_ratio_threshold = 0.25
buffer_usage_max_pct = 80
buffer_usage_resume_pct = 50
max_rewrite_per_cycle = 1024

[dedup]
enabled = true
workers = 2
buffer_skip_threshold_pct = 90
pending_skip_threshold_entries = 0
# ── RESIZE TEST: faster scanner cycle so the migration walker + grow trigger
#    run at an observable pace (each cycle migrates cuckoo_migrate_max_per_cycle
#    OLD pages). 2s vs the 30s production default.
rescan_interval_ms = 2000
max_rescan_per_cycle = 4096
cold_tail_max_per_cycle = 4096
# ── RESIZE TEST: online cuckoo modulus auto-resize.
cuckoo_auto_resize = true
cuckoo_grow_watermark = 0.5
cuckoo_grow_factor = 2
cuckoo_max_buckets = 4194304
cuckoo_migrate_max_per_cycle = 1024

[threading]
enabled = false

[service]
socket_path = "/tmp/onyx-storage-nvme.sock"

[ha]
enabled = false
node_id = 0
heartbeat_interval_ms = 3000
lease_duration_secs = 30
