# Chunklet RAID backend profile (Phase 2): LV3 (RAID6) + LV2 (RAID10) both live
# on chunklet LogicalDisks carved from ONE pool over the raw NVMe. metadb still
# lives on its own XFS mount (Phase 3 will move it).
#
# Disk plan (⚠ NVMe names reshuffle across reboots — verify by CONTENT every
# session: `lsblk -f` / `blkid`. NEVER touch sda = DELLBOSS system disk):
#   nvme0n1 = XFS LABEL "onyx-meta" -> /mnt/onyx-meta (metadb)   [find by label!]
#   nvme1n1..nvme9n1               -> chunklet pool (9 PDs, no fs signature)
# (Pre-reboot this was nvme8=metadb, nvme0-7,9=pool — the post-reboot rename is
#  why the device list below is by current name; re-check before chunklet-init.)
#
# Run:
#   target/release/onyx-storage -c config/nvme-chunklet.toml chunklet-init --force
#   # copy the printed lv3/lv2/meta ld ids into [chunklet] below, then:
#   target/release/onyx-storage -c config/nvme-chunklet.toml create-volume -n fio-volume -s 274877906944 --compression lz4
#   RUST_LOG=info target/release/onyx-storage -c config/nvme-chunklet.toml start -v fio-volume

[numa]
mode = "confine"
home_node = 0
reserve_cores_per_node = 2
cold_cache_policy = "auto"

[chunklet]
enabled = true
# 9 raw NVMe PDs. ⚠ VERIFY BY CONTENT every reboot (blkid) — names reshuffle.
# 2026-07-01 reboot: metadb = nvme2n1 (XFS LABEL onyx-meta) — EXCLUDED; pool =
# the other 9 (nvme0,1,3-9). sda = DELLBOSS system disk — never touch.
# RAID6 set width = 8, so the 9th PD leaves one-PD rebuild headroom.
devices = [
    "/dev/nvme0n1",
    "/dev/nvme1n1",
    "/dev/nvme3n1",
    "/dev/nvme4n1",
    "/dev/nvme5n1",
    "/dev/nvme6n1",
    "/dev/nvme7n1",
    "/dev/nvme8n1",
    "/dev/nvme9n1",
]
io_backend = "uring"
spare_pct = 5
# NOTE: chunklet descriptor v2 RLE codec exists but the pool allocator does NOT
# yet place chunklets column-contiguously (S2 TODO), so a large LD's descriptor
# stays uncompressed and overflows the 4028-byte superblock slot (~146 chunklets
# max/LD: encoded body ≈ 1199 + 25.6·chunklets B must stay < 4028 → ≤110
# chunklets ≈ num_rows 13). num_rows=12 (96 chunklets, 72 GiB usable, ~3657 B
# descriptor) fits with margin and holds a 32 GiB fio volume at ~44% full —
# enough headroom that the allocator never starves (removes the
# GC-churn/overcommit confound for the write-path ceiling measurement) without
# needing the S2 allocator work.
#
# LV3 = RAID6 (6 data + 2 parity), 12 rows, 4 KiB strip -> ~72 GiB usable (96 chunklets).
# 4 KiB strip => full-stripe = 6 data x 4 KiB = 24 KiB. Paired with
# storage.raid_full_stripe_writes=true + the 24 KiB coalesce below, onyx aligns
# stripe-multiple units to a 24 KiB boundary so chunklet takes its zero-RMW
# full-stripe path (roadmap ③). NVMe: 4K is the sweet spot, no HDD big-block need.
lv3 = { raid = "raid6", set_size = 6, row_size = 1, num_rows = 12, strip_kib = 4 }
# LV2 = RAID10 (2-way mirror, 2-wide stripe), 6 rows -> ~12 GiB usable (24 chunklets).
lv2 = { raid = "raid10", set_size = 2, row_size = 2, num_rows = 6, strip_kib = 0 }
# metadb LD (created but unused until Phase 3) -> ~2 GiB (4 chunklets).
meta = { raid = "raid10", set_size = 2, row_size = 2, num_rows = 1, strip_kib = 0 }
# Filled in after `chunklet-init --force` (re-init'd post-reboot on nvme1-9):
lv3_ld_id = "95c825bd-c870-41d5-83ad-6e23d5d6dd16"
lv2_ld_id = "93f79453-b215-4be3-9bec-f6e55fc10e6d"
meta_ld_id = "31158fdb-5e38-4150-a4ad-a541b9691d5a"

[meta]
path = "/mnt/onyx-meta/metadb"
wal_dir = "/mnt/onyx-meta/wal"
block_cache_mb = 32768
memtable_budget_mb = 8192
index_pin_mb = 8192
lsm_bloom_bits_per_entry = 20
checkpoint_interval_ms = 5000
group_commit_timeout_us = 1
dedup_shards = 8
dedup_cuckoo_buckets = 64000000
dedup_l1_cache_entries = 256000
l2p_buffer_enabled = true
rc_authoritative_reclaim = true
commit_direct_apply_enabled = true
bfg_threads_enabled = true
parallel_l2p_drain_enabled = false

[storage]
# data_device omitted: LV3 comes from the chunklet pool.
block_size = 4096
use_hugepages = false
default_compression = "Lz4"
io_backend = "uring"
uring_sq_entries = 1024
read_pool_workers = 32
# Roadmap ③: allocate + write LV3 units that are a whole number of RAID6
# stripes on a stripe-aligned PBA so chunklet takes its zero-RMW full-stripe
# path. Pairs with the stripe-multiple coalesce below — a unit only qualifies
# when its block count is a multiple of the 6-block (24 KiB) stripe. Default
# off in code; turned on here for the A/B baseline.
raid_full_stripe_writes = true

[buffer]
# device omitted: LV2 comes from the chunklet pool. capacity_mb is ignored in
# the chunklet path (the ring sizes from the LD capacity).
capacity_mb = 32768
flush_watermark_pct = 80
group_commit_wait_us = 100
shards = 16
max_memory_mb = 16384
volatile_memory_mb = 49152
staging_queue_entries = 1048576
sync_batch_max_entries = 131072
sync_batch_max_bytes_mb = 1024

[ublk]
nr_queues = 32
queue_depth = 256
io_buf_bytes = 1048576
queue_workers = 4

[flush]
compress_workers = 2
# Coalesce to exactly ONE RAID6 stripe (6 × 4 KiB = 24 KiB). A full coalesce
# unit is then a stripe multiple, so `raid_full_stripe_writes` can align it and
# chunklet writes it as a zero-RMW full stripe. Incompressible fio data
# (--refill_buffers) stays raw (min_compression_savings gate) at exactly 6
# blocks → 0 pad. Box A/B sweep: try 6 (1 stripe) vs 12 LBAs / 49152 (2 stripes).
coalesce_max_raw_bytes = 24576
coalesce_max_lbas = 6
min_compression_savings_pct = 12
skip_fully_superseded = true
packed_meta_batch_max_lbas = 1024

[engine]
zone_count = 64
zone_size_blocks = 256
# Replay-CRC hunt: a killed-under-load pool replays a 100K+ entry tail; the
# 60s default recovery timeout aborts engine open mid-replay. 10 min headroom
# (the 470K-entry c3 replay took 266s, diagnostics add overhead).
recovery_timeout_ms = 600000

[gc]
enabled = true
scan_interval_ms = 5000
dead_ratio_threshold = 0.25
buffer_usage_max_pct = 80
buffer_usage_resume_pct = 50
max_rewrite_per_cycle = 1024

[dedup]
enabled = true
workers = 2
buffer_skip_threshold_pct = 90
pending_skip_threshold_entries = 0
rescan_interval_ms = 30000
max_rescan_per_cycle = 4096
cold_tail_max_per_cycle = 4096

[threading]
enabled = false

[service]
socket_path = "/tmp/onyx-storage-nvme.sock"

[ha]
enabled = false
node_id = 0
heartbeat_interval_ms = 3000
lease_duration_secs = 30
