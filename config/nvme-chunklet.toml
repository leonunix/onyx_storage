# Chunklet RAID backend profile (Phase 2): LV3 (RAID6) + LV2 (RAID10) both live
# on chunklet LogicalDisks carved from ONE pool over the raw NVMe. metadb still
# lives on its own XFS mount (Phase 3 will move it).
#
# Disk plan (⚠ NVMe names reshuffle across reboots — verify by CONTENT every
# session: `lsblk -f` / `blkid`. NEVER touch sda = DELLBOSS system disk):
#   nvme0n1 = XFS LABEL "onyx-meta" -> /mnt/onyx-meta (metadb)   [find by label!]
#   nvme1n1..nvme9n1               -> chunklet pool (9 PDs, no fs signature)
# (Pre-reboot this was nvme8=metadb, nvme0-7,9=pool — the post-reboot rename is
#  why the device list below is by current name; re-check before chunklet-init.)
#
# Run:
#   target/release/onyx-storage -c config/nvme-chunklet.toml chunklet-init --force
#   # copy the printed lv3/lv2/meta ld ids into [chunklet] below, then:
#   target/release/onyx-storage -c config/nvme-chunklet.toml create-volume -n fio-volume -s 274877906944 --compression lz4
#   RUST_LOG=info target/release/onyx-storage -c config/nvme-chunklet.toml start -v fio-volume

[numa]
mode = "confine"
home_node = 0
reserve_cores_per_node = 2
cold_cache_policy = "auto"

[chunklet]
enabled = true
# 9 raw NVMe PDs. ⚠ VERIFY BY CONTENT every reboot (blkid) — names reshuffle.
# 2026-07-01 reboot: metadb = nvme2n1 (XFS LABEL onyx-meta) — EXCLUDED; pool =
# the other 9 (nvme0,1,3-9). sda = DELLBOSS system disk — never touch.
# RAID6 set width = 8, so the 9th PD leaves one-PD rebuild headroom.
devices = [
    "/dev/nvme0n1",
    "/dev/nvme1n1",
    "/dev/nvme2n1",
    "/dev/nvme3n1",
    "/dev/nvme4n1",
    "/dev/nvme5n1",
    "/dev/nvme6n1",
    "/dev/nvme7n1",
    "/dev/nvme8n1",
    "/dev/nvme9n1",
]
io_backend = "uring"
# Submit an adjacency-merged strip group as one IORING_OP_WRITEV with an iovec per
# strip instead of copying the strips into one bounce buffer. ON BY DEFAULT in code
# since 2026-08-02; `false` is the rollback.
#
# WHY: per-PD strip data is 24 KiB-strided in memory for a 6+2 stripe, so a merged
# group can never be contiguous in the caller's buffer — the copy is inherent to
# merging, and it is what made merging a NET LOSS (with the LV3 wide-run refill on,
# the merge saved 0.29 ms/call of SQE wait but the materialise stage grew 0.075 ->
# 1.019 ms/call, so chunklet_r6_batch `write` went 0.981 -> 1.660 ms).
#
# BOX ACCEPTANCE 2026-08-02, 4 arms x (400 s burn + 480 s window), read as the
# pre-submit stage per submit call (`chunklet_submit_<class>` split printed by
# tools/flush_delta.py). Paired with the once-per-op grouping key landed the same
# session (chunklet 91b87aa) — the two are complementary, neither alone is enough:
#
#   class              before   grouping fix   + writev    stage share of the call
#   foreground (LV2)   205.3      37.9 us       4.7 us      56.8%  ->   4.9%
#   drain_data (LV3)   505        179.5 us     52.2 us      34.0%  ->   3.6%
#   drain_meta        1262        499.0 us    131.8 us      53.6%  ->   5.0%
#
# bounce_bytes and bounce_allocs go to 0; sqes/call and the merge factor are
# UNCHANGED (this must not alter IO shape); 0 errors / 0 CRC events on both writev
# arms. ⚠ The payoff is CPU on the ack path, NOT bandwidth: LV2 `lane` duty
# 56.4 -> 41.6% and `coord` 41.7 -> 28.8% (~1.3 cores returned), while throughput
# stayed inside this box's drift band (235.7 / 259.2 / 287.5 / 222.8 MB/s across the
# four arms, NOT monotone in the fix — do not read a bandwidth effect into it).
#
# Any strip that is not itself block aligned (parity strips are plain Vec<u8>) falls
# its whole group back to the bounce path, so correctness never depends on this.
uring_writev_coalesce = true
spare_pct = 5
# Phase 4d online-failover acceptance: watchdog probes every live PD's head
# superblock (O_DIRECT), N consecutive misses -> mark_pd_failed -> (auto_failover)
# background online rebuild-to-spare. rebuild is now ONLINE (io_lock.read during
# backfill), so foreground IO keeps flowing — safe to leave auto_failover on.
watchdog_enabled = true
watchdog_interval_secs = 10
watchdog_fail_threshold = 3
auto_failover = true
# num_rows is no longer capped at ~13. The old wall was the 4 KiB superblock slot
# (4028-byte manifest body) plus a row-major allocator whose fragmented placement
# made the per-position RLE descriptor grow ~216 B/row. Two chunklet fixes removed
# it: (S2) banded column-contiguous placement rotates the position->PD map per
# row-band so the LD spreads balanced across ALL PDs (no idle disk, many-to-many
# rebuild) while the descriptor stays O(N*positions), independent of num_rows;
# (R3) the superblock slot is now 32 MiB (length-aware writes still touch only the
# used ~4 KiB, no write amplification), giving fault-rebuild + large-pool headroom.
# num_rows can now scale to fill the pool (all 9 PDs carry an even share; box:
# rows=100 => ~89 chunklets/PD). Requires a fresh chunklet pool (superblock v3,
# no migration) — re-run chunklet-init --force.
#
# LV3 = RAID6 (6 data + 2 parity), 100 rows, 4 KiB strip -> ~600 GiB usable (800 chunklets).
# 4 KiB strip => full-stripe = 6 data x 4 KiB = 24 KiB. Paired with
# storage.raid_full_stripe_writes=true + the 24 KiB coalesce below, onyx aligns
# stripe-multiple units to a 24 KiB boundary so chunklet takes its zero-RMW
# full-stripe path (roadmap ③). NVMe: 4K is the sweet spot, no HDD big-block need.
lv3 = { raid = "raid6", set_size = 6, row_size = 1, num_rows = 100, strip_kib = 4 }
# LV2 = RAID10 (2-way mirror, 2-wide stripe), 6 rows -> ~12 GiB usable (24 chunklets).
lv2 = { raid = "raid10", set_size = 2, row_size = 2, num_rows = 6, strip_kib = 0 }
# metadb LD (Phase 3f: metadb now LIVES here). RAID10 2x mirror, 2-wide stripe,
# 32 rows -> ~64 GiB usable (128 chunklets). Carve = 4 KiB superblock + 8 MiB
# catalog A/B + 1 GiB journal ring + ~63 GiB page window (>> 64M-cuckoo ~9 GiB +
# L2P/rc for a 256 GiB volume). Any single meta-LD member PD can fail without
# taking metadb down (the SPOF that /mnt/onyx-meta XFS used to be).
meta = { raid = "raid10", set_size = 2, row_size = 2, num_rows = 32, strip_kib = 0 }
# Filled in after `chunklet-init --force` (Phase 3f re-init, 10 PDs, meta LD 64GiB):
lv3_ld_id = "f77d3014-53b9-4caf-85a3-f6890697e050"
lv2_ld_id = "17459f56-9b43-439f-9e77-5caa9304c7ad"
meta_ld_id = "1766d54f-f546-4390-94b6-09f650f63858"
# Stripe-lock key grouping for the LV2 LD ONLY: chunklet hashes `key >> shift`,
# so 10 collapses 1024 contiguous 4 KiB keys (4 MiB) onto one lock bucket, and
# a ~512-key mirror write stops holding ~512 of the 65536 buckets for the whole
# call. Box 2026-08-26: at 512 keys two concurrent calls are disjoint with
# probability 1.8 %, which is why raising submit depth moved aqu-sz 1.42 -> 2.19
# but blew `stripe_wait` p50 84 -> 1919 us and host throughput 592 -> 437 MB/s
# (memory stripe_lock_footprint_blocks_queue_depth). Same fix RAID6/LV3 already
# has by default; per-id because the metadb LD is also RAID10 but writes
# scattered single pages, where grouping would only manufacture false sharing.
# 0 = off (chunklet's per-RAID-level default for a mirror). Read at pool open, so
# an A/B is arms 0 / 10 / 0 with a restart each, judged on tools/mirror_delta.py
# `stripe_wait` mean AND p50 first, then total_us, then submit_us — NOT on host
# throughput. Requires lv2_ld_id above (the id must be known before open).
lv2_lock_group_shift = 0

[meta]
# Phase 3f: metadb persists on the chunklet meta LD (see [chunklet].meta_ld_id),
# not the host FS. `path` is now only a diagnostic label; there is no
# pages.onyx_meta / wal on disk. This retires the /mnt/onyx-meta XFS SPOF.
backend = "chunklet"
path = "/mnt/onyx-meta/metadb"
block_cache_mb = 32768
memtable_budget_mb = 8192
index_pin_mb = 8192
lsm_bloom_bits_per_entry = 20
checkpoint_interval_ms = 5000
group_commit_timeout_us = 1
dedup_shards = 8
dedup_cuckoo_buckets = 64000000
dedup_l1_cache_entries = 256000
# `metaio-*` page-write pool: 16, down from the compiled 32. Census 2026-09-18
# (/root/p1/p12) measured it at 2.41 mean runnable / maxR 20 / 7.5% duty over 32
# threads -- the second-largest wait-class group in the engine.
# ⚠ This is the checkpoint's DEVICE parallelism (one io_uring per worker, <=1 MiB
# per ticket), and a metadb checkpoint is the only thing that releases LV2 ring
# space, so it lands on foreground append latency before it lands on CPU. 16 sits
# at the measured peak of 20; going lower trades checkpoint parallelism for
# threads and needs its own arm judged on `metadb_commit.total_us` + the release
# cadence (tools/checkpoint_delta.py), NOT on thread count.
page_write_workers = 16
l2p_buffer_enabled = true
# Global L2P-mutation budget per Open BFG. The historical 64k default rolled a
# BFG (and forced a checkpoint) every 64k mutations, causing a checkpoint storm.
# Pin the box-validated 4M value so this profile is also safe with older binaries;
# the crossing batch bounds submitted work to limit + max_single_batch - 1.
l2p_buffer_soft_entries = 4000000
rc_authoritative_reclaim = true
commit_direct_apply_enabled = true
bfg_threads_enabled = true
# Parallel per-shard L2P fold. Default-ON in metadb; pinned here so the box
# config is explicit. NOTE: the "+100% / 72x p999" figures once quoted for this
# knob were burst-phase artifacts of measuring on a freshly created pool. Re-run
# 2026-07-25 on an aged pool it is 25.0 vs 25.2 MiB/s — no throughput effect.
# Keep it for fold-latency (tail) reasons only. See memory
# write_drain_22mbps_lv2_durability_roundtrip + checkpoint_interval_duty_cycle_lockin.
parallel_l2p_drain_enabled = true
# Fan-out cap for the fold above. 8 is also the code default since 2026-08-26;
# pinned here because this profile is the one it was measured on. The fold is
# ~48% of a checkpoint's wall time and the checkpoint is the ONLY thing that
# releases LV2 ring space, so this cap sits directly on the foreground's
# `backpressure_wait`. Bracketed A/B 4/8/4 (tools/l2p_fold_workers_ab.sh):
# concurrency 3.91 -> 7.69, fold wall -38%, checkpoint request->release -22% at
# both p50 and p95. ⚠ TAIL ONLY — host throughput tracked arm ORDER, not the
# knob. Do not raise to 16: per-shard fold time already rose 19% at 8-wide.
parallel_l2p_drain_workers = 8
# Serial successor-fold worker for the L2P checkpoint. Already default-ON in
# code (onyx 67d9f02); pinned here for explicitness. Its original "+136% median
# drain" number came from the same fresh-pool methodology that was later shown to
# measure burst-phase length rather than the knob, so treat it as unproven for
# throughput. Runtime worker toggle only — no on-disk format gate.
# ⛔ 2026-08-26: measured `metadb_l2p_checkpoint_pipeline: attempts=0` — this has
# NEVER fired on the box. Its gate wants the successor BFG already Quiescing when
# the checkpoint reaches its IO phase (~950 ms in), but the roll timer is 30 s
# (meta.l2p_buffer_max_interval_ms) against a 5.6 s checkpoint cadence. Left on;
# it is inert, not harmful.
l2p_checkpoint_pipeline_enabled = true
# L3 durable RC delta-run persist (metadb v27). Turns the RC checkpoint from
# "fold deltas into base pages + rewrite every touched 4KiB page" (~70x aged
# amplification) into log-structured: append a compact delta-run segment per
# checkpoint, condense into base only every rc_condense_interval_cycles. Requires
# the streaming BFG checkpoint (default on) — metadb refuses the mismatch at open.
# Box-gate P0 (crashed-segment premature-free) fixed by stable-head directory
# recover-ahead (metadb b51aba8); standalone soak clean. Enabled here for the
# onyx-integration Gate 2 (re-drive no-double-count + ckpt amortization).
rc_delta_run_persist_enabled = true
rc_condense_interval_cycles = 8
rc_segment_overlay_max_entries = 4000000

[storage]
# LV3 write-batcher coalesce window. 0 = compiled default (2 ms).
#
# Measured 2026-07-26 with the `lv3_batch` attribution (onyx 22b6170): under
# the 2 ms default, 80-92 % of batches leave the aggregator on the TIMEOUT
# carrying only 37-52 % of `lv3_batch_target_bytes`, and every request sits
# through 1348-1519 us of that window. The window is not coalescing, it is
# waiting.
#
# Steady-state A/B on this box (all four arms sampled only after the LV2 ring
# pinned at ~100 % physical fill, so no arm is measured in its burst phase):
#   coalesce_us = 0   ->  65.9 and 39.1 MB/s   (window 1348 / 1519 us per req)
#   coalesce_us = 200 ->  81.9 and 92.3 MB/s   (window  218 /  200 us per req)
# The two ranges do not overlap, but that is 2 samples per arm on a workload
# whose fio full-run averages DO overlap. Left at the default until a wider
# repeat; set 200 to reproduce the arm above.
lv3_batch_coalesce_us = 0
# ⭐ DEVICE CONCURRENCY — the open lever, left at the shipped default pending the
# box A/B (`tools/lv3_concurrency_ab.sh`, report `tools/lv3_concurrency_report.sh`).
#
# `lv3_batch_target_bytes` both ends an aggregation window AND cuts a writer
# request into chunks, and all of one request's chunks are submitted before any
# is waited on — so LOWERING it converts one lane's batch into several
# independent device calls without shrinking the writer's batch (or its metadb
# commit). Measured baseline at RWMIX=0 (/root/lv3run/dsr_r1, three clean B
# segments): the aggregator holds 1.98 requests of ~3.4 MB per 4 MiB batch, so
# device concurrency is 2.00-2.07 of SIX executors and the drives sit at
# aqu-sz 1.05-1.48. The same LD does 1738 MiB/s at 6 concurrent callers.
#
# `lv3_batch_min_dispatch_bytes` (0 = derive from the byte target) is the floor
# under early dispatch. It is what the 2026-08-14 `lv3_batch_idle_dispatch` arm
# lacked: with a zero floor the aggregator releases a fragment the moment an
# executor frees up, which raised concurrency 0.97 -> 1.35 and lost 1007 -> 771
# MiB/s because the writer's own cycle shrank with it (chunklet 68.4 -> 2.4
# stripes/call, metadb commits 583 -> 2949/s).
#
# The arm to reproduce (over IPC, so it stays inside one process at one pool age):
#   onyx-storage -c <cfg> lv3-batch 1048576 1048576
# and if concurrency pins at ~6, the follow-on needs a RESTART because the
# executor count sizes a thread pool at open:
#   lv3_batch_executors = 12
lv3_batch_target_bytes = 0
lv3_batch_min_dispatch_bytes = 0
# data_device omitted: LV3 comes from the chunklet pool.
block_size = 4096
use_hugepages = false
default_compression = "Lz4"
io_backend = "uring"
uring_sq_entries = 1024
# 12, not 32 (box 2026-09-15, memory `thread_budget_io_readpool_ab`). The pool
# splits in half (`reserved_foreground_workers`), so this is 6 foreground + 6
# background.
#
# WHY. The engine ran 622 OS threads with mean RUNNABLE 117 against 44
# NUMA-confined cores (2.66x oversubscribed, 187k involuntary context
# switches/s — memory `thread_starvation_confirmed_census`), and a per-group
# census found this pool absurdly over budget: 32 threads produced 18.1 mean
# runnable, MORE than the entire 112-thread flusher pipeline (15.1), and
# `read-pool-fg` was the single most-preempted group in the engine at 1311
# involuntary switches/s/thread with 65% of its threads runnable.
#
# Measured, 4 arms with a baseline bracket (420 s burn each, QD256 j16d16
# randrw 70/30, aged 256 GiB volume): 32 -> 12 alongside `ublk.io_workers` 32
# took total threads 622 -> 498, mean runnable 117 -> 71, involuntary switches
# 187k -> 106k/s (-43%), and `lv3-batch-exec-` preemption 205.9 -> 78.0
# switches/s/thread — that last one is the group carrying the 9.65x `compute`
# inflation of memory `chunklet_call_slowdown_is_cpu_starvation`.
#
# ⛔ Throughput is FLAT, and proving that needed the bracket: the identical
# config re-run last came back -14.3%, so the arms must be judged against the
# bracket MEAN (873.6 MiB/s), where they land at -3.2% and -0.4%. Judging
# against the first arm alone reports a bogus -10.1%.
#
# ⚠ Do not take this to 0: `dedup.enabled` with `read_pool_workers == 0`
# disables the LV3 byte verification that makes dedup CORRECT, not faster.
read_pool_workers = 12
# Roadmap ③: allocate + write LV3 units that are a whole number of RAID6
# stripes on a stripe-aligned PBA so chunklet takes its zero-RMW full-stripe
# path. Pairs with the stripe-multiple coalesce below — a unit only qualifies
# when its block count is a multiple of the 6-block (24 KiB) stripe. Default
# off in code; turned on here for the A/B baseline.
raid_full_stripe_writes = true
# A/B knob (default off in code): pack each stripe from same-volume units with
# adjacent LBAs instead of purely by block count. The stripe reserve only gets a
# 24 KiB window back when every block in it is free at once, and one live block
# pins the whole window, so mixing six unrelated LBAs into a stripe is what makes
# `stripe_capable` fall monotonically on an aged pool (43.9% -> 21.7% over 40 min,
# measured 2026-07-27) and pushes the writer onto the general pool. Both packings
# are planned and affinity is kept only when its padding ties or beats size-only,
# so the knob cannot trade space for co-location. Flip to true for the B arm; judge
# it on `flush_writer_stripe_groups` (did the plan change), `flush_writer_alloc_split`
# (reserve miss rate) and `allocator_contiguity` (stripe_capable decay).
stripe_group_lifetime_affinity = false
# Shard the PBA allocator's free space AND its retired set into N address regions,
# each with its own lock. 0 = compiled default (2048), which is ALSO the code
# default since 2026-08-01; 1 = one global lock per structure (rollback path).
#
# Two attributions on this box settled it (`free_lock.<site>` / `retired_lock.<site>`
# in `status`, decomposed by tools/flush_delta.py, QD256 j16d16, aged 256 GiB
# volume, 480 s window deltas). BEFORE -> AFTER:
#   free lock busy            68.4% of ONE mutex     ->  0.02% per region
#   writer_refill WAIT        22.94 ms/acq           ->  0.76 us/acq
#   writer_refill wait_max    1358.82 ms             ->  1.33 ms
#   aligned alloc             871 us/op              ->  2.13 us/op
#   writer `alloc` share      21.0% of writer time   ->  0.2%
#   retire_batch region hold  1588.29 s (87.3% WAIT) ->  153.01 s (2.2% wait)
#   aged_candidates hold/acq  1.169 SECONDS          ->  246 us (max 12.3 ms)
# Sharding shortens no hold and weakens no invariant: the free-check/retired-insert
# atomicity that blocks every cheaper fix is preserved exactly (both structures use
# the SAME region layout, so {pool[i], retired[i]} is the atomic unit) — it only
# splits the locks the two sides collide on.
#
# ⚠ Judge this on the attribution, NOT on throughput. Throughput is FLAT
# (253.4 -> 252.2 MB/s) because the writer spends 85% in `io`, 99.7% of that in
# `submit.io`, and only 5.7% in the real device write: the queue lives downstream
# in LV3 aggregation. The decomposition quantities above are drift-insensitive and
# readable from ONE arm; restart-per-arm throughput A/B is INVALID on this box (two
# identical arms measured 2.13x apart on run-order drift alone).
allocator_regions = 0
# A/B knob (default 0 = off in code). Whole stripes an aligned lane refill prefers
# a stripe-reserve run to be long enough for before it settles for a one-stripe run.
#
# WHY: the refill asks the reserve for `first_fit(one stripe)`, and at a one-stripe
# floor first-fit-by-address degenerates into "take the lowest-address run" — which
# on this aged pool is a 24 KiB window pinned by a single live block. Measured
# 2026-08-01: `allocator_supply` blocks_per_refill 269.9 / runs_per_refill 43.9 =
# **6.15 blocks per run**, i.e. 64 isolated windows in the lane cache. So the
# writer's consecutive stripes land at unrelated PBAs, chunklet's per-PD adjacency
# merge collapses to **1.02x**, and one flusher batch becomes **563 separate 4 KiB
# device writes** (78% of the RAID6 call, 84.6% of `submit.io`) — while
# `largest_run = 76800` (a whole region) of intact material sat unused higher up.
#
# The floor only FILTERS which runs qualify; the pick stays first-fit-by-address and
# a qualifying run is still drained to the refill block budget, so one hit typically
# parks a single multi-thousand-block run and every later carve is adjacent. A miss
# falls back to the legacy one-stripe floor verbatim, so this cannot cause ENOSPC.
#
# GATE (single-arm decomposition, NOT bandwidth — see allocator_regions above):
#   allocator_supply blocks_per_run   6.15  -> >= 48   (+ wide_hits >> wide_misses)
#   chunklet_submit_drain_data merge  1.02x -> ~8x     sqes/call 563 -> ~70
#   chunklet_r6_batch write / total   4.56 / 5.87 ms -> ~0.6 / ~2 ms
# ⚠ Also watch `submit_bounce_bytes`: chunklet materialises a merged group into one
# bounce buffer, so merging raises bounced bytes from 3.5% to ~100% of the batch
# (~2.3 MiB memcpy). Expected to be a large net win against 490 fewer 7.1 us IOs,
# but it is a NEW cost — if it dominates, the follow-up is writev with per-strip
# iovecs instead of the bounce copy.
# Flip to 8 for the B arm.
stripe_refill_run_stripes = 0
# Design D2 (supply for D1): refill a lane from its region's WIDEST free runs
# instead of its lowest-address ones. Off at open; `tools/stripe_run_ab.sh` flips it
# per arm over IPC (`refill-width-bias`). ⛔ Box 2026-08-20: no signal —
# blocks_per_run 12.1 → 11.2-11.9, because this pool's entire largest_run was 1494
# blocks and its reserve runs were ~2 stripes, so there was no wider run to prefer.
# A selector cannot manufacture contiguity. ⚠ It also consumes intact material
# first, so watch `allocator_contiguity largest_run` across segments, not throughput.
stripe_refill_width_bias = false

[buffer]
# A/B knob (default off in code): drain LV2 ring backpressure BEFORE taking the
# append-order stripes. Measured 2026-07-26 randrw 70/30 on the aged full
# volume: order_hold 30.0 ms == backpressure_wait 29.9 ms, i.e. the stripes were
# held for the whole space wait, and the induced order_wait was 20.8 ms of a
# 67 ms append. Flip to true only for an A/B arm until it is proven.
prewait_ring_space_outside_order = false
# device omitted: LV2 comes from the chunklet pool. capacity_mb is ignored in
# the chunklet path (the ring sizes from the LD capacity).
capacity_mb = 32768
flush_watermark_pct = 80
# ⚠ Do NOT lower this to chase append latency. Arm `gcw20` (2026-08-01, with
# lv2_checkpoint_epoch_interval = 8): 100 -> 20 us halved the ack latency again
# (append_wait_durable 1333 -> 604 us, every stage duty down: lane 67 -> 41 %,
# coord 40 -> 30 %) and made every USER-VISIBLE number worse — total user IOPS
# 49487 -> 42389, read latency 3666 -> 4361 us, LV3 213.7 vs 246.0 MB/s. The
# front end is not the constraint any more, so buying front-end latency with more
# device ops is a net loss. See memory lv2_epoch_pipeline_handoff.
group_commit_wait_us = 100
# Durability epochs per LV2 packed-checkpoint page write. The page is a recovery
# START POINT (only pool open reads it), so this trades a little replay distance
# for coordinator capacity. Box-accepted 2026-08-01 (arm `ckpt8`): the single
# durability coordinator went 79 % -> 40.4 % duty, ckpt_write 44 % -> 7.4 % of its
# capacity, append_wait_durable 1557-1666 -> 1333 us, user IOPS and read latency
# unchanged-to-better. 87.5 % of epochs skip the write (exactly 7/8).
lv2_checkpoint_epoch_interval = 8
shards = 16
# LV2 global root-write lanes. 0 = compiled default = ONE LANE PER SHARD (16
# here). The old default capped it at 8, which paired two shards per lane.
#
# A/B driver: tools/lv2_lanes_ab.sh (restart per arm — the knob is read at pool
# open). Box-measured 2026-08-25, RWMIX=0 QD256 j16d16 on the aged 256 GiB
# volume, arms 8/16/8 each after its own 430 s burn:
#
#   metric                  lanes=8   lanes=16   lanes=8
#   append_total          8570 us    5386 us    9153 us   -39%
#   wait_durable p99     37749 us   12059 us   39846 us   -68%
#   entry_write           3304 us    1091 us    3561 us   -67%
#   prepared_queue        1503 us     448 us    1627 us   -70%
#
# ⚠ Throughput was FLAT (610/568/579 MB/s, inside the 8-arms' own 5.3% spread)
# and drive util stayed ~20%: in-flight appends fell 159 -> 93 at fixed QD256, so
# the appends stopped being the queue. Judge this knob on latency, not bandwidth.
#
# ⚠ A shard maps to a lane by `shard_idx % lanes`, so any value keeps a shard's
# batches on ONE lane. That is required: the LV2 durability watermark is a PREFIX
# marker, so out-of-order publication would ack an unwritten append.
lv2_write_lanes = 0
max_memory_mb = 16384
volatile_memory_mb = 49152
staging_queue_entries = 1048576
sync_batch_max_entries = 131072
sync_batch_max_bytes_mb = 1024

[ublk]
# 8, not 32: each queue costs one `ublk-fio-volume` daemon thread, and since the
# shared io-worker pool landed (086a47a) that is ALL a queue costs -- the 32
# `ublk-io-worker` threads are a separate pool and keep their size. Measured
# 2026-09-18 over 4 bracketed arms (memory `combined_screen_nrq8_plus_coalesce_pool`):
# `ublk-fio-volume` 33 -> 9 threads, throughput +1.78% on a 1.57% baseline spread
# (i.e. free, not a win), involuntary FLAT per unit work, errors 0.
# ⚠ The arithmetic reason to expect MORE from this was falsified
# (`ublk_nr_queues_8_vs_32_ab`); keep it as a thread cut, not a throughput lever.
#
# ⭐ 4, not 8, since 2026-09-18 (box p15, 6 restart-per-arm segments, 3 of them
# baseline — memory `nr_queues_sweep_drain_depth_vs_completion_wait`). The
# mechanism is the COMPLETION DRAIN and it is dose-responsive: completions per
# eventfd wake 1.91 (three identical segments) -> 2.5 at 4 -> 3.03 at 2, and
# `ublk-fio-volume` handoffs per MiB 21.3 -> 10.0 -> 5.1, i.e. 1/nr_queues.
# Nothing else moved (io-worker 0.0%, durable +0.7%, LV2 +0.8%, apply_wait flat,
# errors 0). Engine-wide voluntary switches per MiB -3.8% at 4.
#
# ⛔ 2 is measured and NOT shipped: it buys only 4.9 more vol/MiB (1.8% of the
# engine total, against 11.3 for the 8->4 step) and it costs **+21% mean
# `completion_wait`** (134.5 -> 162.4 us), because a completion then waits
# longer for its queue thread's next drain. That is the concentration risk
# showing up exactly where predicted. At 4 the same cost is +2..5%, i.e. noise.
# Raise it only with a tail-latency measurement, which `status` cannot give
# (`user_io_latency_ns` carries totals, not percentiles).
nr_queues = 4
queue_depth = 256
io_buf_bytes = 1048576
queue_workers = 4
# Serve all 32 queues from ONE pool of nr_queues*queue_workers = 128 threads
# instead of pinning 4 private threads to each queue. Same thread count, but
# every worker is reachable from every queue.
#
# WHY (box 2026-08-24, QD256 j16d16 randrw 70/30 on a filled 256 GiB volume):
# with private pools the whole host load funnels into 3-4 hardware queues,
# because the kernel picks the queue from the SUBMITTING CPU and `[numa]
# confine` leaves the reserve cores as the only idle CPUs for fio's threads
# (`/sys/block/ublkb0/mq/27/cpu_list` = 44,46,92 — 44/46 are the reserved
# pair). Measured on the private-pool arms: mean in-service concurrency 13.9
# and 14.8 against a 128-thread cap, per-queue worker CPU over one 60 s window
# 703/526/478 ticks for q27/q31/q29 vs 0-4 for ALL of q0..q15, and
# `ublk_read_split_ns` queue_wait = 19.6-21.3 ms = 92% of read / 98% of write
# host latency. Doubling fio's job count (j32d16) doubled concurrency to 28.1 —
# concurrency tracks the number of SUBMITTER CPUS, which is the signature of
# this funnel and of nothing else.
shared_io_workers = true
# 32 explicit, NOT the 0 default (0 = nr_queues * queue_workers = 128).
#
# WHY. The per-group census (memory `thread_starvation_confirmed_census`) found
# this pool to be the engine's single biggest CPU contender: 128 threads
# producing 37.3 mean RUNNABLE and 73k of the engine's 187k involuntary context
# switches/s, against 44 NUMA-confined cores. Cutting it to 32 dropped total
# mean runnable 117 -> 68 and gave every OTHER group relief too — the flusher
# stages roughly halved their runnable counts, i.e. they started getting CPU
# when they asked for it. Full 4-arm table in memory
# `thread_budget_io_readpool_ab`; throughput is flat (see the bracket warning
# on `storage.read_pool_workers`).
#
# ⚠⚠ 32 is the FLOOR at QD256, and this is NOT a CPU pool — it is a
# CONCURRENCY pool. The worker BLOCKS: writes park in `append()` until the LV2
# fdatasync (~85% `durable_wait_ns`) and reads park on the read pool. A blocked
# worker serves nothing, so this number caps how many host IOs can be in
# flight. At this load 46k reads/s x ~1.5 ms mean ≈ 70 worker-seconds/s, so 128
# was not arbitrary; at 32 the LV2 ring emptied (`buffer_physical_fill_pct`
# 86 -> 2, pending 2507 -> 449), which is INTAKE concurrency falling, not the
# drain speeding up. Wanting it smaller means making the worker stop blocking
# (async completion), not picking a smaller number.
io_workers = 32

[flush]
# ── Shared stage pools: one pool per stage instead of one per buffer shard ──
#
# WHY. The flusher's five stages are sized `buffer.shards x workers`, so 16
# shards spend 112 OS threads. Box census 2026-09-16 (memory
# `thread_starvation_confirmed_census`) measured the whole 112-thread pipeline at
# 15.1 mean runnable on 44 confined cores — i.e. the thread count is ~7x the CPU
# demand, and the engine was 2.2x oversubscribed with 187k involuntary context
# switches/s. These pools were built and box-measured earlier (memory
# `flush_compress_cleanup_shared_pool`, throughput flat at 638 -> 554 threads)
# but were never turned on in this config.
#
# Each job carries its own routing (`CoalesceUnit`/`CompressedUnit.shard_idx`),
# so a pool worker returns its result to the shard it came from; `false`
# reproduces the per-shard behaviour exactly. Sizes default to 8 / 4 / 8, at or
# under `worker_queue::MAX_RECEIVERS_PER_CHANNEL` — do NOT raise them past 8
# without routing through `WorkerQueue`, or admission hits the crossbeam
# O(receivers)-under-one-mutex cliff (-36% measured on the direct-IO pool).
#
#   compress  16 x 2 = 32  ->  8
#   cleanup   16 x 1 = 16  ->  4
#   dedup     16 x 2 = 32  ->  8
shared_compress_pool = true
shared_cleanup_pool = true
# Same treatment for the admission stage: 16 per-shard coalescers -> a pool of 8
# that CLAIM shards (`9cdae6a`). Fairness is structural (one shared rotation
# counter), so no shard can be starved by a busy neighbour. Measured free in the
# same 4-arm bracket as nr_queues above; `flusher-coalesc` 16 -> 8 threads.
shared_coalesce_pool = true
compress_workers = 2
# Coalesce to exactly ONE RAID6 stripe (6 × 4 KiB = 24 KiB). A full coalesce
# unit is then a stripe multiple, so `raid_full_stripe_writes` can align it and
# chunklet writes it as a zero-RMW full stripe. Incompressible fio data
# (--refill_buffers) stays raw (min_compression_savings gate) at exactly 6
# blocks → 0 pad. Box A/B sweep: try 6 (1 stripe) vs 12 LBAs / 49152 (2 stripes).
coalesce_max_raw_bytes = 24576
coalesce_max_lbas = 6
min_compression_savings_pct = 12
skip_fully_superseded = true
packed_meta_batch_max_lbas = 1024
# Design D1 — whole stripes ONE LV3 write op may cover. ⛔ MEASURED A DEAD END
# (box 2026-08-20): chunklet's adjacency merge already works ACROSS ops — the
# baseline arm has one 24 KiB stripe per op and still merges 1.79x — so a wider op
# changes nothing at the device. 3 interleaved pairs: r6 ops/call 291 → 209 but
# sqes/call 1278-1308 → 1335-1359 (UP), write leg +0.5..+1.1 ms, host −1.3..−2.4%.
# Keep at 1. Raising it for another arm must happen HERE, not over IPC, because the
# value at open sizes the slab arena's class table (a 32-stripe bundle is 192 blocks
# against the arena's default 64; over IPC alone the bundles fall back to the heap
# and bump mem_arena.overflow). Driver: tools/stripe_run_ab.sh.
stripe_run_max_stripes = 1
# ⚠ The writer lane's read-active batch targets — what a MIXED workload actually
# runs on. `read_active` is derived from the GLOBAL read counter (any read in the
# engine bumps it), so at 70/30 every lane is read-active on essentially every
# cycle and its 32-unit target makes each LV3 request 128 KiB — which is why the
# aggregator has to fold ~9 lanes to build one device call. Confirm with
# `flush_writer_batch: read_active_cycles / cycles` in `status` (it reads 0.0 at
# RWMIX=0 and is expected near 1.0 at 70/30) BEFORE tuning these.
#
# Note the drain-size half of that path caps nothing: writer_read_active_batch_size
# has equalled flush.writer_batch_size (1024) since 2026-05. Foreground reads are
# separately protected by the coalescer's flush_admission_qos.
#
# Left at the compiled defaults pending the box A/B. The arm to reproduce, over
# IPC so it stays inside one process (raise the deadline WITH the target or the
# lane just times out at the old size):
#   onyx-storage -c <cfg> writer-batch 256 2000 0
writer_read_active_batch_target_units = 0
writer_read_active_batch_coalesce_us = 0
writer_batch_target_bytes = 0
# Flush QoS OFF. The 100 ms default arms a foreground admission ladder that
# measured as a net negative on this box: A/B over interleaved arms gave
# OFF 233/233 MiB/s with p99 22.5 ms, ON 198 or 63.9 MiB/s with the collapsed
# arm never recovering (p99.9 4.5 s). Mean throughput was +78 % with it off and
# the latency was better too, so this is not a throughput-vs-latency trade.
foreground_flush_target_p99_ms = 0

[engine]
zone_count = 64
zone_size_blocks = 256
# 0 = no absolute cap on engine-open replay: a deep ring legitimately takes
# minutes (~1300 entries/s, a full ring is ~15 min), so any constant small
# enough to bound a hang also aborts a healthy replay. A stall — pending not
# falling for recovery_stall_timeout_ms — is what refuses the open now.
recovery_timeout_ms = 0
recovery_stall_timeout_ms = 60000
# Graceful shutdown drains the ring on the same progress-gated rule. It used to
# be a hardcoded 60 s whose result was DISCARDED, so `stop` under load abandoned
# the backlog, stamped the superblock clean and reported success.
shutdown_drain_timeout_ms = 0
shutdown_drain_stall_timeout_ms = 60000

[gc]
enabled = true
scan_interval_ms = 5000
dead_ratio_threshold = 0.25
buffer_usage_max_pct = 80
buffer_usage_resume_pct = 50
max_rewrite_per_cycle = 1024

[dedup]
# Shared dedup stage pool: 16 x 2 = 32 threads -> 8. See the pool note under
# [flush]. The dedup loop reads the UNIT's shard_idx (not the worker's) for its
# backpressure gate, done-route and miss-route, which is what makes sharing it
# safe — see DedupConfig::shared_pool.
shared_pool = true
enabled = true
workers = 2
buffer_skip_threshold_pct = 90
pending_skip_threshold_entries = 0
rescan_interval_ms = 30000
max_rescan_per_cycle = 4096
cold_tail_max_per_cycle = 4096

[threading]
enabled = false

[service]
socket_path = "/tmp/onyx-storage-nvme.sock"

[ha]
enabled = false
node_id = 0
heartbeat_interval_ms = 3000
lease_duration_secs = 30

# Hot-path memory scheduling (src/mem). The LV3 writer's run/unit buffers come
# from a per-lane, pre-faulted, grow-only slab arena instead of per-buffer
# alloc_zeroed + fill(0), which box-measured 21.1 ms of every 59.66 ms `io` leg
# (2026-08-17). Watch `mem_arena:` in `onyx status`: hits/takes should sit at
# ~100%, grows should stop after warm-up, overflow must stay 0.
#
# Defaults are deliberate; the two reasons to touch this section:
#   arena_enabled = false  -> the A/B baseline arm (old heap path, no rebuild)
#   arena_hugepage = true  -> its own separate arm (THP can add alloc stalls)
[mem]
arena_enabled = true
arena_max_bytes_per_lane = 0   # 0 = 64 MiB ceiling per lane; grows on demand
arena_max_class_blocks = 0     # 0 = 64 blocks (256 KiB), covers stripe + max unit
arena_hugepage = false

[cores]
# Physical cores carved out of the confine engine set for the 6 LV3 batch
# executors to own exclusively. 0 = they stay in the shared background set.
#
# ⛔⛔ MEASURED 2026-09-16, 3 bracketed arms (memory `lv3_dedicated_cores_zero_sum`):
# it WORKS and it buys NOTHING. At 3 (6 logical CPUs for 6 threads) this group's
# involuntary preemption fell 48.4 -> 0.36 switches/s/thread (134x), chunklet
# `compute` 8.59 -> 6.29 us/stripe (-26.8%, halving the gap to the 4.56 us
# standalone CPU-only control) and r6 `write` -38.9% -- while total throughput
# went -2.9% against a +1.8% bracket drift, because the 6 CPUs come out of the
# other 38: total involuntary switches rose 91k -> 125k and ublk-io-worker
# preemption 823 -> 1116/s/thread.
#
# At 92% CPU utilisation, MOVING cpu between roles is zero-sum. Keep it at 0.
# ⚠ Untested at RWMIX=0, the only load where the LV3 drain actually binds.
lv3_dedicated_cores = 0
# Physical cores for the LV2 commit-log sync threads (persistent-slot-sync-*).
#
# ⭐ SIZE FROM `mean runnable`, NOT thread count — that is what the LV3 arm above
# got wrong. Post-Phase-1 census on 44 confined cores:
#   ublk-io-worker-   32 thr  meanR 10.6-11.7   792-855 involuntary sw/s/thread
#   persistent-slot   33 thr  meanR  7.9-8.6    611-655
#   read-pool-fg       6 thr  meanR  3.4-3.7   1063-1170
#   lv3-batch-exec-    6 thr  meanR  0.87           48
# LV2 is the engine's SECOND-largest CPU consumer; LV3 is about one CPU's worth.
# 5 cores (10 logical on SMT2) covers LV2's ~8.2 with headroom. 33 threads share
# the set on purpose — they are preempted, not saturated (34% runnable).
#
# ⚠ Pair with a lower numa.reserve_cores_per_node when testing: BufferSync is a
# foreground role and foreground_cores_per_node=0 makes both halves the full
# engine set, so the carve-out is otherwise taken straight out of everyone else.
#
# ⛔⛔ MEASURED 2026-09-18, 8 interleaved segments in ONE process (memory
# `lv2_dedication_throughput_retracted`): the earlier +5.4% does NOT reproduce.
# Against a THREE-point bracket, lv2=5 + reserve=0 came in at -2.47%. The
# MECHANISM is not in doubt (LV2 preemption -66.1%, total involuntary -13.0%),
# but contention fell while throughput fell ⇒ the binding constraint is
# CAPACITY, and a dedication converts shared capacity into private IDLE capacity
# (10 CPUs for 6.48 meanR = 35% wasted). Keep it at 0.
lv2_dedicated_cores = 0
# Physical cores the WAIT CLASS is fenced onto — the INVERSE of the two knobs
# above, and the reason it exists is that both of them lost.
#
# Census 2026-09-18 (310 threads / 44 confined cores): 176 threads — 57% of the
# engine — ask for 19.49 CPUs BETWEEN THEM, at 5-8% per-thread duty, because
# they are sized for CONCURRENCY (each must be able to block without holding up
# the thread behind it) and not for work. Total demand is 70.5 CPUs against 44,
# so handing cores to a busy role cannot create capacity; packing the waiters
# can, because low duty tolerates oversubscription by definition.
#   metadb-apply         64 thr  meanR 3.59   5.6% duty
#   metaio               32 thr  meanR 2.47   7.7%
#   flusher-writer       16 thr  meanR 1.12   7.0%
#   flusher-post-commit   8 thr  meanR 0.49   6.1%
#   ---------------------------------------------------
#   all four            120 thr  meanR 7.67   -> 4 cores (8 logical) = ~96% used
#
# ⛔⛔ MEASURED 2026-09-18, 7 interleaved segments in ONE process (memory
# `wait_class_fence_raises_total_preemption`): the fence WORKS and the hypothesis
# is FALSIFIED. All 120 threads confine correctly, the fenced set ran 91% used --
# the criterion the LV2 retraction said to size by -- and it still lost:
#   arm            MiB/s   involuntary/s        apply_wait us/commit
#   B (n=3)        903.9         104,584                      1234   spread 6.12%
#   W  4 cores     905.3         122,909 (+17.5%)             1391   (+12.7%)
#   WA 3 cores     891.6         116,582                      1305
#   W5 5 cores     880.0         131,294                      1268
# Throughput flat (nothing resolves against a 6.12% bracket) but the MECHANISM
# went the OTHER WAY, tightly: the two W segments agree on involuntary/s to
# 0.27%. Per-thread preemption ROSE on every compute-bound group -- read-pool
# +27.2%, ublk-io-worker +21.0%, flusher-dedup +18.2%, compress +18.6%,
# persistent-slot +16.6% -- because a fence does not only park the waiters, it
# also TAKES 8 CPUs AWAY FROM THE BUSY SIDE. Total demand was unchanged (~68
# mean runnable); only its placement moved.
#
# ⭐⭐⭐ Both directions of static partitioning are now measured and both lose:
# dedicating to a busy role (lv2/lv3 above) and fencing the idle ones. At 1.55x
# oversubscription, "reserve a set that is nearly fully used" is NECESSARY BUT
# NOT SUFFICIENT. The lever is reducing demand, not placing it. Keep at 0.
#
# Arms: tools/core_budget_ab.sh (W / W5 / WA), flipped over the `cores` IPC --
# no restart and no config rewrite, so this file stays at 0.
wait_class_cores = 0
# Which groups wait_class_cores applies to: comma list of metadb-apply, metaio,
# flusher-writer, flusher-post-commit, or "all"/empty. Ignored when 0.
wait_class_groups = "all"
