# NUMA-aware profile for the RHEL NVMe development host (v4).
#
# nvme-box has 96 logical CPUs interleaved across 2 NUMA nodes:
#   node 0 = even CPUs   0,2,4,...,94
#   node 1 = odd  CPUs   1,3,5,...,95
#
# H2 evolution:
#   v1/v2: pinned ublk fully to node 1 to keep node 0 reserved for
#          metadb. Result: write tail improved 4-10x but every read's
#          ublk -> metadb blockmap lookup became cross-NUMA, pushing
#          read p99 from 3.3ms to 4.9ms and p99.9 from 18ms to 35ms.
#   v4 (this): keep ublk on mixed NUMA "0-31" (matches baseline) so
#          half the ublk threads are local to metadb's page cache.
#          Move metadb apply lanes off the ublk range (use 32+ even
#          CPUs) so they're still NUMA-clean. flusher_writer stays on
#          node 0 since it calls commit_ops directly into metadb.
#
# Expected layout:
#   /dev/nvme0n1     -> XFS at /mnt/onyx-meta (metadb)
#   /dev/md/onyx-lv2 -> 4x NVMe RAID0 LV2 buffer
#   /dev/nvme4n1     -> raw LV3 data device

[meta]
path = "/mnt/onyx-meta/metadb"
wal_dir = "/mnt/onyx-meta/wal"
block_cache_mb = 65536
memtable_budget_mb = 8192
index_pin_mb = 8192
lsm_bloom_bits_per_entry = 20
checkpoint_interval_ms = 1000
group_commit_timeout_us = 1
unlogged_flush_commits = true
# 2026-05-15: cap single-flush sample size so dirty work drains
# continuously rather than in 8 s bursts. nvme-box sweep validated
# 100k as the sweet spot on this profile (buffer_volatile_payload
# 12.3 GB → 0.59 GB; READ +2.7 %; READ p99 -16 %). Higher values
# (500k / 2M) trailed the parallel-rc-drain baseline.
flush_dirty_pages_threshold = 100000
# Partial sample-phase budget. Default 0 (full sample every flush).
#
# 2026-05-15 nvme-box sweep (this file's profile): budget=100_000
# capped per-flush sample / IO / reclaim correctly (sample_max
# 13.1 s → 0.6 s; meta_io batch 4.9 GB → 390 MB) but pinned
# `manifest.checkpoint_lsn = min(per-shard last_flushed_lsn)`,
# starving the unlogged-buffer reclaim path. READ IOPS -8.5 %,
# buffer_volatile_payload 0.6 GB → 32 GB. Disabling
# `unlogged_flush_commits` only made it worse (buffer 42 GB, WAL
# fsync 228 k / 600 s). Leaving partial off until a workload
# emerges where it actually helps.
flush_select_budget = 0
dedup_shards = 8
dedup_cuckoo_buckets = 64000000
dedup_l1_cache_entries = 256000

[storage]
data_device = "/dev/nvme4n1"
block_size = 4096
use_hugepages = false
default_compression = "Lz4"
io_backend = "uring"
uring_sq_entries = 1024
read_pool_workers = 16

[buffer]
device = "/dev/md/onyx-lv2"
capacity_mb = 1048576
flush_watermark_pct = 80
group_commit_wait_us = 100
shards = 16
max_memory_mb = 32768
volatile_memory_mb = 49152
staging_queue_entries = 1048576
sync_batch_max_entries = 131072
sync_batch_max_bytes_mb = 1024

[ublk]
nr_queues = 32
queue_depth = 256
io_buf_bytes = 1048576
queue_workers = 4

[flush]
compress_workers = 2
coalesce_max_raw_bytes = 32768
coalesce_max_lbas = 8
min_compression_savings_pct = 12
skip_fully_superseded = true
packed_meta_batch_max_lbas = 1024
commit_workers_per_volume = 8
commit_target_lbas_per_tx = 1024
commit_coalesce_lba_budget = 4096
commit_coalesce_timeout_us = 2000
packed_commit_try_drain_lba_budget = 1024
writer_read_active_batch_size = 1024

[engine]
zone_count = 64
zone_size_blocks = 256

[gc]
enabled = true
scan_interval_ms = 5000
dead_ratio_threshold = 0.25
buffer_usage_max_pct = 80
buffer_usage_resume_pct = 50
max_rewrite_per_cycle = 1024

[dedup]
enabled = true
workers = 2
buffer_skip_threshold_pct = 90
pending_skip_threshold_entries = 16384
rescan_interval_ms = 30000
max_rescan_per_cycle = 4096
cold_tail_max_per_cycle = 4096

[threading]
enabled = true
# ublk + read_pool on mixed NUMA (matches baseline) so a read's
# ublk -> metadb blockmap lookup has 50% chance of being NUMA-local.
# This was the regression source in v1-v3.
ublk_cpus      = "0-31"
read_pool_cpus = "32-47"

# All metadb apply lanes on node 0 even CPUs 48+ (no overlap with
# ublk 0-31 or read_pool 32-47). Eliminates the odd/even 3.5x exec
# asymmetry observed when "64-79" alternated nodes via cpus[ordinal % len].
metadb_l2p_apply_cpus      = "48,50,52,54,56,58,60,62"
metadb_refcount_apply_cpus = "64,66,68,70"
metadb_dedup_apply_cpus    = "72,74"
metadb_wal_cpus            = "76"
metadb_checkpoint_cpus     = "78"
# io_uring submitter threads. Only used when
# DEFAULT_IO_SUBMITTER_POOL_SIZE > 1 in metadb/src/page_store.rs.
# Pool>1 needs each thread on a distinct CPU so the kernel mq-block
# layer routes their IO to a different NVMe hardware queue. Cross-
# NUMA pinning (e.g. "1,3,5" while metadb data is on node 0 evens)
# net-regresses badly — confirmed 4k LBA/s in test. Leaving empty
# inherits OS default; pool=1 path is unaffected.
metadb_io_submitter_cpus   = ""

# flusher_writer must be NUMA-local with metadb (calls commit_ops);
# also on node 0. cleanup runs the dedup-cleanup read-back path which
# also touches metadb, so node 0 too.
flusher_writer_cpus  = "80,82,84,86"
flusher_cleanup_cpus = "88,90"
background_cpus      = "92,94"

# Remaining flusher upstream stages on node 1 odd CPUs 49+ (no role
# overlap; ublk 1-31 odd and read_pool 33-47 odd are reserved above).
buffer_sync_cpus      = "49,51,53,55"
flusher_coalesce_cpus = "57,59,61,63"
flusher_dedup_cpus    = "65,67,69,71,73,75,77,79"
flusher_compress_cpus = "81,83,85,87,89,91,93,95"

[service]
socket_path = "/tmp/onyx-storage-nvme.sock"

[ha]
enabled = false
node_id = 0
heartbeat_interval_ms = 3000
lease_duration_secs = 30
