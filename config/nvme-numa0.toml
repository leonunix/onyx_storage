# NUMA single-node profile (Tier 0 fix for the bimodal single-vol throttle).
#
# ROOT CAUSE (verified 2026-05-31): nvme-box NUMA nodes are INTERLEAVED
# (node0 = even CPUs 0,2,..,94; node1 = odd CPUs 1,3,..,95). Every contiguous
# `*_cpus` range in the as-is profile therefore straddles BOTH nodes, and
# affinity `pick(ordinal)=cpus[ordinal%len]` scatters each pipeline role 50/50
# across sockets while the big shared buffers first-touch on a random node.
# The cross-socket tax throttles the front-end into a bimodal stall (most runs
# ~100-170 MiB/s, occasionally ~580; run-to-run, steady-within-run). numa_balancing
# on/off makes no difference -> it is the static scatter, not balancer thrash.
#
# THIS PROFILE confines the whole engine to ONE NUMA node via the in-engine
# `[numa] mode = "confine"` (docs/numa-aware-design.md Phase 0). No numactl
# prefix needed any more:
#
#   target/release/onyx-storage -c config/nvme-numa0.toml start -v fio-volume
#
# Compared to the old "numactl --cpunodebind=0 --membind=0 +
# threading.enabled=false" recipe this additionally (a) re-binds the libublk
# per-queue threads that used to ESCAPE numactl to node1, (b) reserves
# `reserve_cores_per_node` physical cores for the OS/SSH (soaks used to
# freeze interactive logins by saturating every node-0 core), and (c) prints
# a startup memory plan and refuses configs whose hot-path (Tier A) memory
# cannot fit the node (capacity caches spill by policy, not kernel accident).
#
# Bind the client (fio) to node-0 cores NOT used by ublk queue threads, or
# leave it unpinned. NEVER pin fio to all of node1: libublk queue threads
# live there in legacy setups and time-sharing with them blows up front-end
# p99 (16ms -> 135ms measured 2026-06-11).
#
# Measured baseline under numactl confinement (j16 qd64 4k-32k randwrite,
# refill_buffers): stable ~1080 MiB/s (1092/1071/1073, ~1% stdev), NEVER
# stuck -- vs the both-nodes profile's bimodal 113-578. Phase-0 exit gate:
# this profile must reproduce that baseline within ±5% WITHOUT numactl.

[numa]
mode = "confine"
home_node = 0
reserve_cores_per_node = 2
cold_cache_policy = "auto"
#
# Disk layout (same as config/nvme-lv3raid.toml):
#   /dev/nvme1n1            -> XFS, /mnt/onyx-meta (metadb)
#   /dev/md/onyx-lv2_0 (md127) -> LV2 write buffer RAID0
#   /dev/md/onyx-lv3   (md126) -> LV3 data device RAID0

[meta]
path = "/mnt/onyx-meta/metadb"
wal_dir = "/mnt/onyx-meta/wal"
# Shrunk 64G->32G for single-node confinement: the 2026-06-11 2h soaks
# proved the old 144G budget collapses node0 regardless of mempolicy
# (PREFERRED spills hot allocations, BIND pays reclaim tax). Tier A 32G +
# Tier B 32.4G (x1.1 = 71G) leaves ~50G page-cache headroom on the 125G node.
block_cache_mb = 32768
memtable_budget_mb = 8192
index_pin_mb = 8192
lsm_bloom_bits_per_entry = 20
checkpoint_interval_ms = 5000
group_commit_timeout_us = 1
dedup_shards = 8
dedup_cuckoo_buckets = 64000000
dedup_l1_cache_entries = 256000
l2p_buffer_enabled = true
l2p_buffer_soft_entries = 4000000
# rc==0-gated reclaim (d39b398): without it the legacy referenced_extents
# reverify scan stalls the BFG fold minutes into any sustained run (the
# 2026-06-11 "degrades at minute 5" signature). ⚠ Requires a FRESH metadb.
rc_authoritative_reclaim = true
commit_direct_apply_enabled = true
bfg_threads_enabled = true
parallel_l2p_drain_enabled = false

[storage]
data_device = "/dev/md/onyx-lv3"
block_size = 4096
use_hugepages = false
default_compression = "Lz4"
io_backend = "uring"
uring_sq_entries = 1024
read_pool_workers = 16

[buffer]
device = "/dev/md/onyx-lv2_0"
capacity_mb = 1048576
flush_watermark_pct = 80
group_commit_wait_us = 100
shards = 16
max_memory_mb = 16384  # payload cache 32G->16G, see block_cache_mb note
volatile_memory_mb = 49152
staging_queue_entries = 1048576
sync_batch_max_entries = 131072
sync_batch_max_bytes_mb = 1024

[ublk]
nr_queues = 32
queue_depth = 256
io_buf_bytes = 1048576
queue_workers = 4

[flush]
compress_workers = 2
coalesce_max_raw_bytes = 32768
coalesce_max_lbas = 8
min_compression_savings_pct = 12
skip_fully_superseded = true
packed_meta_batch_max_lbas = 1024

[engine]
zone_count = 64
zone_size_blocks = 256

[gc]
enabled = true
scan_interval_ms = 5000
dead_ratio_threshold = 0.25
buffer_usage_max_pct = 80
buffer_usage_resume_pct = 50
max_rewrite_per_cycle = 1024

[dedup]
enabled = true
workers = 2
buffer_skip_threshold_pct = 90
pending_skip_threshold_entries = 0
rescan_interval_ms = 30000
max_rescan_per_cycle = 4096
cold_tail_max_per_cycle = 4096

# Superseded by [numa] mode="confine" (see header); kept disabled so the two
# mechanisms cannot stack.
[threading]
enabled = false

[service]
socket_path = "/tmp/onyx-storage-nvme.sock"

[ha]
enabled = false
node_id = 0
heartbeat_interval_ms = 3000
lease_duration_secs = 30
