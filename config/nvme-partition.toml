# NUMA dual-socket PARTITION profile (design Phase 1, docs/numa-aware-design.md).
# Cloned from nvme-numa0.toml; the ONLY intended difference is
# [numa] mode = "partition" + data_nodes — keep the rest in lockstep for
# clean partition-vs-confine A/B.
#
# ROOT CAUSE (verified 2026-05-31): nvme-box NUMA nodes are INTERLEAVED
# (node0 = even CPUs 0,2,..,94; node1 = odd CPUs 1,3,..,95). Every contiguous
# `*_cpus` range in the as-is profile therefore straddles BOTH nodes, and
# affinity `pick(ordinal)=cpus[ordinal%len]` scatters each pipeline role 50/50
# across sockets while the big shared buffers first-touch on a random node.
# The cross-socket tax throttles the front-end into a bimodal stall (most runs
# ~100-170 MiB/s, occasionally ~580; run-to-run, steady-within-run). numa_balancing
# on/off makes no difference -> it is the static scatter, not balancer thrash.
#
# THIS PROFILE partitions the engine across BOTH NUMA nodes (pod per node):
# buffer shards 0-7 + their flush lanes + metadb lanes 0-7 on node0,
# shards 8-15 on node1; control-plane singletons (WAL, BFG sync, commit
# workers, GC) homed on node0. Tier A per-shard memory first-touches its
# pod; Tier B caches interleave across both nodes. No numactl prefix:
#
#   target/release/onyx-storage -c config/nvme-partition.toml start -v fio-volume
#
# A/B discipline (design §4 Phase 1 exit gate): compare against
# config/nvme-numa0.toml (confine) with >=3 runs per arm; target is
# partition > confine +40% on the UNCAPPED randwrite throughput recipe
# (j16 qd64 4k-32k randwrite refill_buffers; confine baseline ~1080 MiB/s).
# Leave fio unpinned or on reserve cores; NEVER pin fio to all of node1.

[numa]
mode = "partition"
data_nodes = [0, 1]
home_node = 0
reserve_cores_per_node = 2
cold_cache_policy = "auto"
#
# Disk layout (same as config/nvme-lv3raid.toml):
#   /dev/nvme1n1            -> XFS, /mnt/onyx-meta (metadb)
#   /dev/md/onyx-lv2_0 (md127) -> LV2 write buffer RAID0
#   /dev/md/onyx-lv3   (md126) -> LV3 data device RAID0

[meta]
path = "/mnt/onyx-meta/metadb"
wal_dir = "/mnt/onyx-meta/wal"
block_cache_mb = 32768  # home node hosts all metadata (see nvme-numa0.toml note)
memtable_budget_mb = 8192
index_pin_mb = 8192
lsm_bloom_bits_per_entry = 20
checkpoint_interval_ms = 5000
group_commit_timeout_us = 1
dedup_shards = 8
dedup_cuckoo_buckets = 64000000
dedup_l1_cache_entries = 256000
l2p_buffer_enabled = true
l2p_buffer_soft_entries = 4000000
# Direct apply stays ON: metadb now lives whole on the home pod (lanes,
# drain, devices), so the home commit workers applying directly is
# node-local. (Lane-apply across pods was tried and capped the drain at
# ~13k remap/s — the LSN-ordered apply chain can't span sockets.)
commit_direct_apply_enabled = true
# rc==0-gated reclaim (d39b398): WITHOUT this the legacy referenced_extents
# full-volume reverify scan holds tree.read() and stalls the BFG fold a few
# minutes into ANY sustained run — the exact degradation chased through six
# NUMA variants on 2026-06-11. Requires a FRESH metadb (the soak harness
# wipes meta.path each run).
rc_authoritative_reclaim = true
# Async dedup drainer: cuckoo DedupPut off the commit critical path (15x
# commit-tail win in the 2026-06-01 A/B); its per-dedup-shard threads bind
# pod-local under partition.
dedup_drainer_enabled = false  # bisect 2026-06-11: suspect in the t~6min degradation
bfg_threads_enabled = true
# Partition requires the parallel drain: the serial fold runs on the
# home-node BFG sync thread and would re-introduce cross-socket folds for
# the node1 pod's shards; the parallel workers bind per-shard-pod
# (metadb affinity::bind_for_l2p_drain).
parallel_l2p_drain_enabled = false  # bisect: back to baseline metadb flags

[storage]
data_device = "/dev/md/onyx-lv3"
block_size = 4096
use_hugepages = false
default_compression = "Lz4"
io_backend = "uring"
uring_sq_entries = 1024
read_pool_workers = 16

[buffer]
device = "/dev/md/onyx-lv2_0"
capacity_mb = 1048576
flush_watermark_pct = 80
group_commit_wait_us = 100
shards = 16
max_memory_mb = 16384
volatile_memory_mb = 49152
staging_queue_entries = 1048576
sync_batch_max_entries = 131072
sync_batch_max_bytes_mb = 1024

[ublk]
nr_queues = 32
queue_depth = 256
io_buf_bytes = 1048576
queue_workers = 4

[flush]
compress_workers = 2
coalesce_max_raw_bytes = 32768
coalesce_max_lbas = 8
min_compression_savings_pct = 12
skip_fully_superseded = true
packed_meta_batch_max_lbas = 1024

[engine]
zone_count = 64
zone_size_blocks = 256

[gc]
enabled = true
scan_interval_ms = 5000
dead_ratio_threshold = 0.25
buffer_usage_max_pct = 80
buffer_usage_resume_pct = 50
max_rewrite_per_cycle = 1024

[dedup]
enabled = true
workers = 2
buffer_skip_threshold_pct = 90
pending_skip_threshold_entries = 0
rescan_interval_ms = 30000
max_rescan_per_cycle = 4096
cold_tail_max_per_cycle = 4096

# Superseded by [numa] mode="confine" (see header); kept disabled so the two
# mechanisms cannot stack.
[threading]
enabled = false

[service]
socket_path = "/tmp/onyx-storage-nvme.sock"

[ha]
enabled = false
node_id = 0
heartbeat_interval_ms = 3000
lease_duration_secs = 30
